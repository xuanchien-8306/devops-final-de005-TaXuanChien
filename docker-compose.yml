# =============================================================================
#  docker-compose.yml - FILE KHUNG
#  - Service "mysql", networks, volumes: ĐÃ CẤU HÌNH SẴN, không cần sửa.
#  - Hệ thống chỉ gồm backend Spring Boot (trả JSON), Nginx làm reverse proxy, MySQL.
#  - Mạng: proxy-net (nginx <-> app), db-net (app <-> mysql); MySQL KHÔNG publish cổng.
#  - Sinh viên điền các ô ______ tại các dòng TODO trong service "app" và "nginx".
#  - Chạy:  docker compose --env-file student.env up -d --build
# =============================================================================
name: ${COMPOSE_PROJECT_NAME:?Chua dien COMPOSE_PROJECT_NAME trong student.env}

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-local}
    image: ${APP_IMAGE:-devops-final-app}:${APP_TAG:-latest}
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      - mysql

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  mysql_data: